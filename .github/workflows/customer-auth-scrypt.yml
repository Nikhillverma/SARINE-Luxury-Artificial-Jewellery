name: SARINE customer auth verifier tests

on:
  push:
    branches:
      - customer-auth-migration
    paths:
      - "hostinger-api/lib/firebaseScrypt.js"
      - "hostinger-api/tests/firebaseScrypt.test.js"
      - "hostinger-api/package.json"
      - "hostinger-api/customerAuth.js"
      - "hostinger-api/server.js"
      - "hostinger-api/scripts/**"
      - "hostinger-api/migrations/**"
      - ".github/workflows/customer-auth-scrypt.yml"
  pull_request:
    branches:
      - hostinger-admin-integration
    paths:
      - "hostinger-api/lib/firebaseScrypt.js"
      - "hostinger-api/tests/firebaseScrypt.test.js"
      - "hostinger-api/package.json"
      - ".github/workflows/customer-auth-scrypt.yml"

jobs:
  firebase-scrypt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostinger-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hostinger-api/package-lock.json
      - run: npm ci
      - run: npm test
