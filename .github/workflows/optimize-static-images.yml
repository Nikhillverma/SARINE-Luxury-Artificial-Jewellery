name: Optimize static storefront images

on:
  push:
    branches:
      - hostinger-migration
    paths:
      - ".github/workflows/optimize-static-images.yml"
      - "scripts/optimize-static-images.py"
      - "public/images/*.jpg"
      - "public/images/*.jpeg"
      - "public/images/*.png"

permissions:
  contents: write

jobs:
  optimize:
    if: github.ref == 'refs/heads/hostinger-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: hostinger-migration
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate WebP assets and update references
        run: python scripts/optimize-static-images.py

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/optimized src index.html
          if git diff --cached --quiet; then
            echo "No optimized image changes to commit."
            exit 0
          fi
          git commit -m "chore: optimize static images to WebP"
          git push origin HEAD:hostinger-migration
