name: SARINE storefront verification

on:
  pull_request:
    branches:
      - hostinger-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install, type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Production build
        run: npm run build
