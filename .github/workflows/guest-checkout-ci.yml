name: Guest checkout migration CI

on:
  pull_request:
    branches:
      - hostinger-migration
      - guest-checkout-migration
      - fix/order-timestamps
    paths:
      - "src/**"
      - "hostinger-api/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - ".github/workflows/guest-checkout-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostinger-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hostinger-api/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Check backend JavaScript syntax
        run: |
          node --check server.js
          node --check orders.js
          node --check adminAuth.js
          node --check adminOrders.js
