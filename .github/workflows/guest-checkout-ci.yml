name: Guest checkout migration CI

on:
  pull_request:
    branches:
      - hostinger-migration
      - fix/order-timestamps
    paths:
      - "src/**"
      - "hostinger-api/**"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - ".github/workflows/guest-checkout-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostinger-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hostinger-api/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Check backend JavaScript syntax
        run: |
          node --check server.js
          node --check orders.js
          node --check adminAuth.js
          node --check adminOrders.js

  prune-legacy-dependencies:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 6
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove unused Firebase and Netlify packages
        run: |
          npm ci
          npm uninstall firebase firebase-admin @netlify/functions
          npm uninstall --save-dev @firebase/rules-unit-testing
      - name: Verify dependency-free frontend
        run: |
          npm run lint
          npm run build
      - name: Commit generated package lock
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Remove unused Firebase and Netlify dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
