name: SARINE customer account frontend validation

on:
  pull_request:
    branches:
      - fix/order-timestamps
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/customer-account-frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
