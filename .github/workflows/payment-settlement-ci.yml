name: Razorpay settlement backend CI

on:
  push:
    branches:
      - fix/razorpay-webhook-settlement
    paths:
      - "hostinger-api/**"
      - ".github/workflows/payment-settlement-ci.yml"
  pull_request:
    branches:
      - fix/order-timestamps
    paths:
      - "hostinger-api/**"
      - ".github/workflows/payment-settlement-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: sarine-test
          MARIADB_DATABASE: sarine_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: sarine_test
      DB_USER: root
      DB_PASSWORD: sarine-test
    defaults:
      run:
        working-directory: hostinger-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hostinger-api/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Check payment modules
        run: |
          node --check orders.js
          node --check paymentSettlement.js
          node --check razorpayWebhooks.js
          node --check razorpayCapturedPayment.js
          node --check razorpayWebhookPolicy.js
