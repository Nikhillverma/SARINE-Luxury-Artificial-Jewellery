name: SARINE customer authentication backend CI

on:
  pull_request:
    branches:
      - fix/order-timestamps
    paths:
      - "hostinger-api/**"
      - ".github/workflows/customer-auth-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostinger-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hostinger-api/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend test suite
        run: npm test
